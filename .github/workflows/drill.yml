name: Drill1

on: 
  push:
    branches: main

  workflow_dispatch: 

jobs:

  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Git code
        uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v7

      - name: Install Pytest
        run: pip install pytest

  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Git code
        uses: actions/checkout@v7
            
      - name: Building docker image
        run: docker build -t my-image:$(git rev-parse --short HEAD) .

      - name: Listing Images
        run: docker image ls

      - name: Configuring AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ap-southeast-1
          role-to-assume: arn:aws:iam::704048935634:role/github-actions-ecr-role

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
          



      
