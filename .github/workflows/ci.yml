name: Python Application CI Pipeline

on:
  push:
      branches:
        - main
        - dev

  workflow_dispatch:

permissions: 
  id-token: write
  contents: read
env:
  APP_NAME : my-python-app
  ENVIRONMENT : production

jobs:

  test:
    

    runs-on: ubuntu-latest
    needs: build

    strategy:
      matrix:
        python-version: 
                - '3.12'
                - '3.13'
                - '3.14'

    steps:
      - name: checking out
        uses: actions/checkout@v6

      - name: setup python
        uses: actions/setup-python@v7
        with: 
          python-version: ${{ matrix.python-version }}
          

      - name: Install dependencies
        run: pip install pytest
        
      - name: Displaying information
        run: |
          hostname
          cat /etc/os-release
          python --version
          ls -ltrh

      - name: Run tests
        run: pytest --junitxml=test-results.xml

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: test-results.xml
        
      - name: Run application
        run: python app.py

      - name: Checking Status
        if: ${{ success() }}
        run: echo "Job success"

      - name: checking status
        if: ${{ failure() }}
        run: echo "Job failed"

  aws-test:

    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::704048935634:role/github-actions-ecr-role
          aws-region: ap-southeast-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

  build:

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.build_version }}

    steps:

      - name: Building stage
        run: echo $APP_NAME

      - name: Show GitHub repository IDs
        run: |
          echo "Owner: ${{ github.repository_owner }}"
          echo "Owner ID: ${{ github.repository_owner_id }}"
          echo "Repository: ${{ github.repository }}"
          echo "Repository ID: ${{ github.repository_id }}"

      - name: Hostname 
        run: hostname

      - name: Generate build version
        id: version
        run: echo "build_version=2.5.0" >> "$GITHUB_OUTPUT"

      - name: Show generated version
        run: echo "Build version is ${{ steps.version.outputs.build_version }}"

      - name: Checkout source code
        uses: actions/checkout@v6
        
      - name: Build docker image
        run: |
          docker build \
            -t ${{ vars.DOCKERHUB_USERNAME }}/my-python-app:${{ github.sha }} \
            .

      - name: checking tokens
        run: | 
          echo "USERNAME=${{ vars.DOCKERHUB_USERNAME }}"
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "TOKEN IS EMPTY"
          else
            echo "TOKEN EXISTS"
          fi

      - name: Login Docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/my-python-app:${{ github.sha }}

      - name: Result
        run: echo "Build completed successfully"


  deploy:
  
    runs-on: ubuntu-latest
    needs: build

    if: ${{ github.ref == 'refs/heads/main' }}
    steps:

      - name: Deploying app
        run: | 
          echo "Deploying $APP_NAME to $ENVIRONMENT"
          echo "Deploying $APP_NAME version ${{ needs.build.outputs.version }} to $ENVIRONMENT"

      - name: Final result
        run: echo "Deployment completed successfully"
  
  
  
  


  
      


